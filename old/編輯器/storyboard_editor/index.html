<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>分鏡稿編輯器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #14161a; --panel: #1b1e24; --panel2: #22262e; --line: #2f343d;
    --text: #e6e9ef; --dim: #9aa3b2; --accent: #f0883e; --accent2: #4a9eff;
    --ok: #3fb950; --warn: #d29922;
  }
  body {
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    font: 14px/1.6 "Noto Sans TC", -apple-system, "Segoe UI", sans-serif;
  }
  #top {
    height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #top h1 { font-size: 15px; font-weight: 600; margin-right: 8px; }
  select, button, input, textarea {
    font-family: inherit; font-size: 13px; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1000; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.12); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .spacer { flex: 1; }
  #status { font-size: 12px; color: var(--dim); }

  #main { display: flex; height: calc(100vh - 48px); }
  #left { width: 46%; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #divider { width: 6px; flex-shrink: 0; cursor: col-resize; background: var(--line); transition: background .15s; }
  #divider:hover, body.col-resizing #divider { background: var(--accent); }
  body.col-resizing { cursor: col-resize; user-select: none; }
  #right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .head {
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 10px;
  }
  .body { flex: 1; overflow-y: auto; padding: 10px 14px; }

  /* 左：台詞 */
  .para { margin-bottom: 14px; }
  .unit {
    padding: 5px 9px; border-radius: 5px; cursor: pointer; user-select: none;
    border-left: 3px solid transparent; position: relative;
  }
  .unit:hover { background: var(--panel2); }
  .unit.sel { background: rgba(240,136,62,.18); border-left-color: var(--accent); }
  body.dragging { user-select: none; cursor: grabbing; }
  body.dragging .body { cursor: grabbing; }
  .unit.assigned { color: var(--dim); }
  .unit.assigned::after {
    content: attr(data-sid); position: absolute; right: 8px; top: 5px;
    font-size: 10px; color: var(--accent2); background: rgba(74,158,255,.12);
    padding: 1px 6px; border-radius: 3px;
  }
  .unit.sel.assigned { color: var(--text); }

  /* 右：編輯器 */
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 11px; color: var(--dim);
    margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px;
  }
  .field input, .field textarea, .field select { width: 100%; }
  .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .label-row label { margin: 0; }
  button.mini { padding: 3px 10px; font-size: 12px; }
  button.mini.on { background: var(--accent2); color: #04121f; border-color: var(--accent2); font-weight: 600; }
  body.reselect #source { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(74,158,255,.2); }
  body.reselect #left { box-shadow: inset 0 0 0 2px rgba(74,158,255,.35); }
  .field textarea { resize: vertical; line-height: 1.55; }
  #prompt { min-height: 150px; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  #source { min-height: 60px; background: #191c22; color: var(--dim); font-size: 12px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .check input { width: auto; }

  #sceneList { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); max-height: 92px; overflow-y: auto; }
  .chip {
    padding: 3px 9px; border-radius: 12px; font-size: 12px; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--line);
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); color: #1a1000; border-color: var(--accent); font-weight: 600; }
  .chip.empty { border-style: dashed; color: var(--dim); }

  #preview { max-width: 100%; border-radius: 6px; border: 1px solid var(--line); display: none; }
  #cands { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  #cands.show { display: grid; }
  .cand { position: relative; cursor: pointer; border: 2px solid var(--line); border-radius: 6px; overflow: hidden; }
  .cand:hover { border-color: var(--accent); }
  .cand.sel { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(74,158,255,.3); }
  .cand img { width: 100%; display: block; }
  .cand span {
    position: absolute; left: 4px; top: 4px; font-size: 11px; font-weight: 600;
    background: rgba(0,0,0,.65); color: #fff; padding: 1px 6px; border-radius: 3px;
  }
  .empty-note { color: var(--dim); text-align: center; padding: 40px 20px; font-size: 13px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--panel2); color: var(--dim); }
</style>
</head>
<body>

<div id="top">
  <h1>分鏡稿編輯器</h1>
  <select id="scriptSel"></select>
  <select id="seriesSel"></select>
  <input id="newSeries" placeholder="或新系列名稱" style="width:130px">
  <select id="imgDirSel" title="圖片存放/讀取資料夾" style="max-width:200px"></select>
  <button id="btnRenum" title="依台詞順序重新編號整個系列">重新編號</button>
  <div class="spacer"></div>
  <span id="status"></span>
</div>

<div id="main">
  <div id="left">
    <div class="head">
      <span>語音稿台詞</span>
      <span class="tag" id="unitCount"></span>
      <div class="spacer"></div>
      <span id="selInfo" style="color:var(--accent)"></span>
      <select id="focusType" style="padding:3px 6px"></select>
      <button class="primary" id="btnNew" disabled>建立分鏡</button>
    </div>
    <div class="body" id="units"></div>
  </div>

  <div id="divider" title="拖曳調整左右欄寬度"></div>

  <div id="right">
    <div id="sceneList"></div>
    <div class="head">
      <span id="editTitle">分鏡編輯</span>
      <div class="spacer"></div>
      <button id="btnGen" disabled>生成提示詞</button>
      <button id="btnImg" disabled>生成圖片</button>
      <button id="btnBatch" disabled>批次生成 8 張</button>
      <button id="btnDel" disabled>刪除</button>
      <button class="primary" id="btnSave" disabled>儲存</button>
    </div>
    <div class="body" id="editor">
      <div class="empty-note">從左邊選取台詞後按「建立分鏡」，或點上方的分鏡編號來編輯</div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let UNITS = [], SCENES = [], CUR = null, SEL = new Set(), BOOT = null, reselectMode = false;

// 重選模式：把目前選取的台詞即時組回 source 欄位
function syncSelToSource() {
  const el = $('source');
  if (!el) return;
  el.value = [...SEL].sort((a, b) => a - b)
    .map(u => (UNITS.find(x => x.uid === u) || {}).text).filter(Boolean).join(' ');
}

function setReselect(on) {
  reselectMode = on;
  document.body.classList.toggle('reselect', on);
  const btn = $('btnReselect');
  if (btn) {
    btn.classList.toggle('on', on);
    btn.textContent = on ? '✓ 完成選取' : '🔗 重新選取台詞';
  }
  status(on ? '重新選取中：在左邊拖曳或點台詞，完成後記得按「儲存」' : '已更新選取，記得按「儲存」寫入',
    on ? 'var(--accent2)' : 'var(--ok)');
}

const status = (m, c) => { $('status').textContent = m; $('status').style.color = c || 'var(--dim)'; };
const series = () => $('newSeries').value.trim() || $('seriesSel').value;
const imgDir = () => $('imgDirSel').value;

// 依目前系列自動挑對應的圖片資料夾（優先 _flux2）
function syncImgDir() {
  const dirs = BOOT && BOOT.image_dirs || [];
  const s = series();
  const hit = dirs.find(d => d === `images_${s}_flux2`) || dirs.find(d => d === `images_${s}`);
  if (hit) $('imgDirSel').value = hit;
}

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

async function boot() {
  BOOT = await api('/api/bootstrap');
  $('scriptSel').innerHTML = BOOT.scripts.map(s => `<option>${s}</option>`).join('');
  $('seriesSel').innerHTML = BOOT.series.map(s => `<option>${s}</option>`).join('');
  $('focusType').innerHTML = BOOT.focus_types.map(f => `<option>${f}</option>`).join('');
  const magic = BOOT.scripts.find(s => s.includes('魔法'));
  if (magic) $('scriptSel').value = magic;
  const ms = BOOT.series.find(s => s.includes('魔法'));
  if (ms) $('seriesSel').value = ms;
  $('imgDirSel').innerHTML = (BOOT.image_dirs || []).map(d => `<option>${d}</option>`).join('');
  syncImgDir();
  if (!BOOT.has_api_key) status('未設 ANTHROPIC_API_KEY：自動生成只給模板骨架', 'var(--warn)');
  await loadScript(); await loadScenes();
}

async function loadScript() {
  const d = await api('/api/script?file=' + encodeURIComponent($('scriptSel').value));
  UNITS = d.units;
  $('unitCount').textContent = UNITS.length + ' 句';
  renderUnits();
}

async function loadScenes() {
  const s = $('seriesSel').value;
  if (!s) { SCENES = []; renderChips(); return; }
  SCENES = (await api('/api/scenes?series=' + encodeURIComponent(s)
    + '&script=' + encodeURIComponent($('scriptSel').value))).scenes;
  renderChips(); renderUnits();
}

function uidToScene() {
  const m = {};
  SCENES.forEach(sc => (sc.line_range || []).forEach(u => m[u] = sc.id));
  return m;
}

function renderUnits() {
  const map = uidToScene();
  const paras = {};
  UNITS.forEach(u => (paras[u.para] = paras[u.para] || []).push(u));
  $('units').innerHTML = Object.values(paras).map(list =>
    `<div class="para">` + list.map(u => {
      const sid = map[u.uid];
      return `<div class="unit ${SEL.has(u.uid) ? 'sel' : ''} ${sid ? 'assigned' : ''}"
        data-uid="${u.uid}" ${sid ? `data-sid="${sid}"` : ''}>${u.text}</div>`;
    }).join('') + `</div>`
  ).join('');
  bindUnits();
  $('selInfo').textContent = SEL.size ? `已選 ${SEL.size} 句` : '';
  $('btnNew').disabled = !SEL.size;
}

let dragging = false, dragStart = null, dragMoved = false, dragStartSid = null;

function applyRange(fromUid, toUid) {
  const [a, b] = [Math.min(fromUid, toUid), Math.max(fromUid, toUid)];
  SEL.clear();
  for (let i = a; i <= b; i++) SEL.add(i);
  renderUnits();
  if (reselectMode) syncSelToSource();
}

function bindUnits() {
  const box = $('units');
  box.onmousedown = e => {
    const el = e.target.closest('.unit');
    if (!el) return;
    e.preventDefault();                       // 阻止原生反白選字
    dragging = true; dragMoved = false;
    dragStart = +el.dataset.uid;
    dragStartSid = el.dataset.sid || null;
    if (!e.shiftKey) SEL.clear();
    SEL.add(dragStart); renderUnits();
    if (reselectMode) syncSelToSource();
    document.body.classList.add('dragging');
  };
  box.onmousemove = e => {
    if (!dragging) return;
    const el = e.target.closest('.unit');
    if (!el) return;
    const uid = +el.dataset.uid;
    if (uid !== dragStart) dragMoved = true;
    applyRange(dragStart, uid);
  };
}

// 開啟分鏡的判斷放在 mouseup（mousedown 會重繪，原生 click 不可靠）
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  document.body.classList.remove('dragging');
  // 重選模式：單擊不跳轉，維持選取即可（已在 mousedown 同步 source）
  if (reselectMode) return;
  // 一般模式：單擊已分配的台詞 → 開啟該分鏡
  if (!dragMoved && dragStartSid) openScene(dragStartSid);
});

function renderChips() {
  $('sceneList').innerHTML = SCENES.map(s =>
    `<div class="chip ${CUR === s.id ? 'active' : ''} ${s.prompt ? '' : 'empty'}" data-id="${s.id}">
      ${s.id}${s.scene ? ' · ' + s.scene.slice(0, 14) : ''}</div>`).join('')
    || '<span style="color:var(--dim);font-size:12px">尚無分鏡</span>';
  $('sceneList').querySelectorAll('.chip').forEach(c => c.onclick = () => openScene(c.dataset.id));
}

function openScene(id) {
  const s = SCENES.find(x => x.id === id);
  if (!s) return;
  CUR = id;
  reselectMode = false; document.body.classList.remove('reselect');  // 切換場景退出重選
  SEL = new Set(s.line_range || []);
  renderChips(); renderUnits();
  $('editTitle').textContent = '編輯 ' + id;
  ['btnGen', 'btnImg', 'btnBatch', 'btnDel', 'btnSave'].forEach(b => $(b).disabled = false);
  $('editor').innerHTML = `
    <div class="field"><label>預覽圖</label>
      <img id="preview" src="/api/image?series=${encodeURIComponent(series())}&image_dir=${encodeURIComponent(imgDir())}&id=${id}&t=${Date.now()}"
        onload="this.style.display='block'" onerror="this.style.display='none'">
      <div id="cands"></div></div>
    <div class="field">
      <div class="label-row">
        <label>涵蓋的語音稿原文（source）</label>
        <button id="btnReselect" class="mini">🔗 重新選取台詞</button>
      </div>
      <textarea id="source" readonly>${esc(s.source || '')}</textarea></div>
    <div class="field" style="border:1px dashed var(--line);padding:8px 10px;border-radius:6px;background:#191c22">
      <div class="label-row">
        <label>貼上 AI 回覆（JSON）→ 自動填入各欄位</label>
        <button id="btnApply" class="mini">套用</button>
      </div>
      <textarea id="aiPaste" placeholder="把 Claude 回覆的 JSON 整段貼在這裡，按「套用」會自動填入下方 6 個欄位" style="min-height:56px"></textarea></div>
    <div class="row">
      <div class="field"><label>場景標題 scene</label>
        <input id="f_scene" value="${esc(s.scene || '')}"></div>
      <div class="field"><label>地點 location</label>
        <input id="f_location" value="${esc(s.location || '')}"></div>
    </div>
    <div class="field"><label>焦點提示 focus_hint</label>
      <input id="f_focus" value="${esc(s.focus_hint || '')}"></div>
    <div class="field"><label>關鍵台詞 dialogue</label>
      <input id="f_dialogue" value="${esc(s.dialogue || '')}"></div>
    <div class="field"><label class="check">
      <input type="checkbox" id="f_nochar" ${s.no_characters ? 'checked' : ''}> 畫面無人物 (no_characters)
    </label></div>
    <div class="field"><label>生圖提示詞 prompt</label>
      <textarea id="prompt">${esc(s.prompt || '')}</textarea></div>`;
  $('btnReselect').onclick = () => setReselect(!reselectMode);
  $('btnApply').onclick = applyAiReply;
  // 若這格 tmp 裡還有上次沒挑完的候選圖，重新顯示
  api(`/api/tmp-images?series=${encodeURIComponent(series())}&image_dir=${encodeURIComponent(imgDir())}&id=${id}`)
    .then(d => { if (d.variants && d.variants.length) renderCands(d.variants); })
    .catch(() => {});
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

$('btnNew').onclick = async () => {
  const s = series();
  if (!s) return status('請選擇或輸入系列名稱', 'var(--warn)');
  status('建立中…');
  const d = await api('/api/scene/new', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      series: s, uids: [...SEL], script_file: $('scriptSel').value,
      focus_type: $('focusType').value
    })
  });
  if ($('newSeries').value.trim()) {
    BOOT = await api('/api/bootstrap');
    $('seriesSel').innerHTML = BOOT.series.map(x => `<option>${x}</option>`).join('');
    $('seriesSel').value = s; $('newSeries').value = '';
  }
  await loadScenes(); openScene(d.scene.id);
  status('已建立 ' + d.scene.id, 'var(--ok)');
};

$('btnSave').onclick = async () => {
  const s = SCENES.find(x => x.id === CUR); if (!s) return;
  Object.assign(s, {
    scene: $('f_scene').value, location: $('f_location').value,
    focus_hint: $('f_focus').value, dialogue: $('f_dialogue').value,
    no_characters: $('f_nochar').checked, prompt: $('prompt').value,
    line_range: [...SEL].sort((a, b) => a - b),
    source: [...SEL].sort((a, b) => a - b).map(u => (UNITS.find(x => x.uid === u) || {}).text).filter(Boolean).join(' '),
  });
  await api('/api/scene', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ series: series(), scene: s })
  });
  await loadScenes(); renderChips();
  if (reselectMode) { reselectMode = false; document.body.classList.remove('reselect');
    const rb = $('btnReselect'); if (rb) { rb.classList.remove('on'); rb.textContent = '🔗 重新選取台詞'; } }
  status('已儲存 ' + CUR, 'var(--ok)');
};

$('btnGen').onclick = async () => {
  const src = ($('source') || {}).value || '';
  if (!src.trim()) return status('這一格沒有語音稿原文', 'var(--warn)');
  const d = await api('/api/gen-instruction', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: src })
  });
  try {
    await navigator.clipboard.writeText(d.instruction);
    status('已複製生成指令到剪貼簿 → 貼給 Claude，再把回覆貼回「貼上 AI 回覆」框', 'var(--ok)');
  } catch (e) {
    // 剪貼簿失敗時，退而把指令塞進貼上框讓使用者手動複製
    if ($('aiPaste')) $('aiPaste').value = d.instruction;
    status('無法自動複製，指令已顯示在下方框內，請手動複製', 'var(--warn)');
  }
};

// 解析 Claude 回覆的 JSON，自動填入 6 個欄位
function applyAiReply() {
  const raw = ($('aiPaste') || {}).value || '';
  let txt = raw.trim();
  const m = txt.match(/\{[\s\S]*\}/);        // 抓第一個 {...}，容忍多餘文字或 ``` 圍欄
  if (!m) return status('貼上框裡找不到 JSON', 'var(--warn)');
  let obj;
  try { obj = JSON.parse(m[0]); }
  catch (e) { return status('JSON 解析失敗：' + e.message, 'var(--warn)'); }
  const set = (id, v) => { if (v !== undefined && $(id)) $(id).value = v; };
  set('f_scene', obj.scene);
  set('f_location', obj.location);
  set('f_focus', obj.focus_hint);
  set('f_dialogue', obj.dialogue);
  set('prompt', obj.prompt);
  if (obj.no_characters !== undefined && $('f_nochar')) $('f_nochar').checked = !!obj.no_characters;
  status('已套用 AI 回覆，請檢查後按「儲存」', 'var(--ok)');
}

$('btnImg').onclick = async () => {
  status('生成圖片中…（可能要 30 秒）');
  $('btnImg').disabled = true;
  try {
    const d = await api('/api/generate-image', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ series: series(), id: CUR, image_dir: imgDir(), seed: Math.floor(Math.random() * 90000) })
    });
    status(d.ok ? '✓ 圖片完成，已更新預覽' : ('✗ ' + (d.note || '生成失敗') + '，見 console'),
      d.ok ? 'var(--ok)' : 'var(--warn)');
    if (!d.ok) console.error(d.note, d.stdout, d.stderr);
    // 只有真的產出新圖才重載預覽，避免誤以為更新成功
    if (d.updated) {
      const img = $('preview');
      img.src = `/api/image?series=${encodeURIComponent(series())}&image_dir=${encodeURIComponent(imgDir())}&id=${CUR}&t=${Date.now()}`;
    }
  } catch (e) { status('失敗：' + e.message, 'var(--warn)'); }
  $('btnImg').disabled = false;
};

// 批次生成 8 張候選圖到 tmp，挑選後才搬成正式圖
$('btnBatch').onclick = async () => {
  status('批次生成 8 張中…（可能要好幾分鐘）');
  $('btnBatch').disabled = true; $('btnImg').disabled = true;
  try {
    const d = await api('/api/batch-generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ series: series(), id: CUR, image_dir: imgDir(), seed: Math.floor(Math.random() * 90000) })
    });
    if (d.ok) {
      renderCands(d.variants);
      status(`✓ 已生成 ${d.count} 張候選，點縮圖選一張`, 'var(--ok)');
    } else {
      status('✗ ' + (d.note || '批次生成失敗') + '，見 console', 'var(--warn)');
      console.error(d.note, d.stdout, d.stderr);
    }
  } catch (e) { status('失敗：' + e.message, 'var(--warn)'); }
  $('btnBatch').disabled = false; $('btnImg').disabled = false;
};

function renderCands(variants) {
  const box = $('cands');
  if (!box) return;
  if (!variants || !variants.length) { box.className = ''; box.innerHTML = ''; return; }
  const q = `series=${encodeURIComponent(series())}&image_dir=${encodeURIComponent(imgDir())}&id=${CUR}&sub=tmp`;
  box.innerHTML = variants.map(v =>
    `<div class="cand" data-v="${v}"><img src="/api/image?${q}&variant=${v}&t=${Date.now()}"><span>${v}</span></div>`
  ).join('');
  box.className = 'show';
  box.querySelectorAll('.cand').forEach(el => el.onclick = () => pickCand(el.dataset.v));
}

async function pickCand(v) {
  if (!confirm(`採用候選圖 ${v}？其餘 7 張會被刪除。`)) return;
  status('搬移中…');
  try {
    await api('/api/pick-image', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ series: series(), id: CUR, variant: v, image_dir: imgDir() })
    });
    renderCands([]);
    const img = $('preview');
    img.src = `/api/image?series=${encodeURIComponent(series())}&image_dir=${encodeURIComponent(imgDir())}&id=${CUR}&t=${Date.now()}`;
    status(`✓ 已採用候選圖 ${v}`, 'var(--ok)');
  } catch (e) { status('失敗：' + e.message, 'var(--warn)'); }
}

$('btnDel').onclick = async () => {
  if (!confirm('確定刪除 ' + CUR + '？')) return;
  await api(`/api/scene?series=${encodeURIComponent(series())}&id=${CUR}`, { method: 'DELETE' });
  CUR = null; SEL.clear();
  await loadScenes();
  $('editor').innerHTML = '<div class="empty-note">已刪除</div>';
  ['btnGen', 'btnImg', 'btnDel', 'btnSave'].forEach(b => $(b).disabled = true);
  status('已刪除', 'var(--ok)');
};

$('scriptSel').onchange = loadScript;
$('seriesSel').onchange = async () => { CUR = null; SEL.clear(); syncImgDir(); await loadScenes(); };

// 依台詞順序重新編號整個系列（先預覽再執行）
$('btnRenum').onclick = async () => {
  const body = { series: series(), script: $('scriptSel').value };
  status('計算新編號中…');
  try {
    const pre = await api('/api/renumber', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, dry_run: true })
    });
    if (!pre.changed) return status('編號已經是正確順序，不需調整', 'var(--ok)');
    const list = pre.changes.slice(0, 12).map(([o, n]) => `${o} → ${n}`).join('\n');
    const more = pre.changes.length > 12 ? `\n…以及其他 ${pre.changes.length - 12} 筆` : '';
    if (!confirm(
      `依台詞順序重新編號，共 ${pre.total} 格，其中 ${pre.changed} 格會改號：\n\n${list}${more}\n\n` +
      `對應的圖片檔案也會一起改名。確定執行？`
    )) return status('已取消');

    status('重新編號中…');
    const d = await api('/api/renumber', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    CUR = null; SEL.clear();
    await loadScenes();
    status(`✓ 已重新編號，${d.changed} 格調整`, 'var(--ok)');
  } catch (e) { status('失敗：' + e.message, 'var(--warn)'); }
};

// 切換圖片資料夾 → 重載目前這格的預覽圖
$('imgDirSel').onchange = () => {
  if (!CUR) return status('圖片資料夾：' + imgDir());
  const img = $('preview');
  if (img) img.src = `/api/image?series=${encodeURIComponent(series())}&image_dir=${encodeURIComponent(imgDir())}&id=${CUR}&t=${Date.now()}`;
  status('圖片資料夾：' + imgDir());
};

// 左右欄可拖曳調整寬度（記憶到 localStorage）
(function initDivider() {
  const divider = $('divider'), left = $('left'), main = $('main');
  const saved = localStorage.getItem('leftWidth');
  if (saved) left.style.width = saved;
  let dragging = false;
  divider.addEventListener('mousedown', e => {
    dragging = true; document.body.classList.add('col-resizing'); e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = main.getBoundingClientRect();
    const w = Math.max(240, Math.min(rect.width - 320, e.clientX - rect.left));
    left.style.width = w + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; document.body.classList.remove('col-resizing');
    localStorage.setItem('leftWidth', left.style.width);
  });
})();

boot().catch(e => status('載入失敗：' + e.message, 'var(--warn)'));
</script>
</body>
</html>
