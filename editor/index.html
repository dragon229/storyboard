<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>分鏡稿編輯器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #14161a; --panel: #1b1e24; --panel2: #22262e; --line: #2f343d;
    --text: #e6e9ef; --dim: #9aa3b2; --accent: #f0883e; --accent2: #4a9eff;
    --ok: #3fb950; --warn: #d29922;
    /* 偶數分鏡編號用的青藍。跟 --accent2 分開，免得跟分隔線／重選模式的功能色混淆 */
    --accent3: #3ec9d9;
  }
  body {
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    font: 14px/1.6 "Noto Sans TC", -apple-system, "Segoe UI", sans-serif;
  }
  #top {
    height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #top h1 { font-size: 15px; font-weight: 600; margin-right: 8px; }
  select, button, input, textarea {
    font-family: inherit; font-size: 13px; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1000; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.12); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .spacer { flex: 1; }
  #status { font-size: 12px; color: var(--dim); }

  #main { display: flex; height: calc(100vh - 48px); }
  #left { width: 46%; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #divider { width: 6px; flex-shrink: 0; cursor: col-resize; background: var(--line); transition: background .15s; }
  #divider:hover, body.col-resizing #divider { background: var(--accent); }
  body.col-resizing { cursor: col-resize; user-select: none; }
  #right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .head {
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 10px;
  }
  .body { flex: 1; overflow-y: auto; padding: 10px 14px; }
  #editor { container-type: inline-size; }   /* 讓 .split 的斷點以編輯區寬度為準 */

  /* 左：台詞 */
  .para { margin-bottom: 14px; }
  /* flex 而不是把編號絕對定位：絕對定位的編號會壓在台詞文字上面 */
  .unit {
    padding: 5px 9px; border-radius: 5px; cursor: pointer; user-select: none;
    border-left: 3px solid transparent;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .unit:hover { background: var(--panel2); }
  .unit.sel { background: rgba(240,136,62,.18); border-left-color: var(--accent); }
  body.dragging { user-select: none; cursor: grabbing; }
  body.dragging .body { cursor: grabbing; }
  .unit.assigned { color: var(--dim); }
  .unit.assigned::after {
    content: attr(data-sid); flex: none; margin-left: auto; margin-top: 2px;
    font-size: 10px; color: var(--accent); background: rgba(240,136,62,.12);
    padding: 1px 6px; border-radius: 3px;
  }
  /* 偶數格用青藍，跟橘色差約 160°，相鄰兩格不會看成同一格 */
  .unit.assigned.sid-even::after { color: var(--accent3); background: rgba(62,201,217,.12); }
  /* 標過問題的格：只加旗子，顏色仍由奇偶決定，兩個資訊互不干擾 */
  .unit.assigned.has-issue::after { content: attr(data-sid) " ⚑"; }
  .unit.sel.assigned { color: var(--text); }

  /* 右：編輯器 */
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 11px; color: var(--dim);
    margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px;
  }
  .field input, .field textarea, .field select { width: 100%; }
  .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .label-row label { margin: 0; }
  button.mini { padding: 3px 10px; font-size: 12px; }
  button.mini.on { background: var(--accent2); color: #04121f; border-color: var(--accent2); font-weight: 600; }
  body.reselect #source { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(74,158,255,.2); }
  body.reselect #left { box-shadow: inset 0 0 0 2px rgba(74,158,255,.35); }
  .field textarea { resize: vertical; line-height: 1.55; }
  #prompt { min-height: 130px; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  #staging { min-height: 90px; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  #source { min-height: 60px; background: #191c22; color: var(--dim); font-size: 12px; }
  /* 畫面命題：下游三步的地基，所以放在 source 正下方、給它一條強調邊 */
  #f_focus { min-height: 44px; font-size: 13px; border-left: 3px solid var(--accent); }
  #f_focus.bad { border-left-color: var(--warn); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; text-transform: none; letter-spacing: 0; }
  .check input { width: auto; }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }

  /* 預覽圖與決策欄位並排：圖固定在左邊一欄，右邊放所有要填的東西。
     欄寬用 % 而不是 px，因為右側面板寬度是可拖曳的。
     --previewW 由中間那條 .vdiv 拖曳時改寫，存在 localStorage。 */
  .split { display: grid; grid-template-columns: minmax(140px, var(--previewW, 30%)) 6px 1fr;
    gap: 0 8px; align-items: start; }
  .split > * { min-width: 0; }
  .split .field:last-child { margin-bottom: 0; }
  .vdiv { align-self: stretch; min-height: 60px; cursor: col-resize; border-radius: 3px;
    background: var(--line); transition: background .15s; }
  .vdiv:hover, body.col-resizing .vdiv { background: var(--accent); }
  /* 斷點看的是編輯區自身寬度，不是視窗——右側面板寬度可以拖 */
  @container (max-width: 720px) {
    .split { grid-template-columns: 1fr; }
    .vdiv { display: none; }
  }
  fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-bottom: 12px; }
  legend { font-size: 11px; color: var(--dim); padding: 0 6px; letter-spacing: .5px; }
  .badge {
    font-size: 10px; padding: 1px 7px; border-radius: 10px;
    background: rgba(210,153,34,.16); color: var(--warn); border: 1px solid var(--warn);
  }

  #preview { max-width: 100%; border-radius: 6px; border: 1px solid var(--line); display: none; }
  /* 候選縮圖跟著預覽圖擠在左欄，欄位窄時自動減少每列張數 */
  #cands { display: none; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin-top: 6px; }
  #cands.show { display: grid; }
  .cand { position: relative; cursor: pointer; border: 2px solid var(--line); border-radius: 6px; overflow: hidden; }
  .cand:hover { border-color: var(--accent); }
  .cand img { width: 100%; display: block; }
  .cand span {
    position: absolute; left: 4px; top: 4px; font-size: 11px; font-weight: 600;
    background: rgba(0,0,0,.65); color: #fff; padding: 1px 6px; border-radius: 3px;
  }
  .empty-note { color: var(--dim); text-align: center; padding: 40px 20px; font-size: 13px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--panel2); color: var(--dim); }

  /* 標記問題 */
  button.flagged { border-color: var(--warn); color: var(--warn); }
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50;
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    width: min(560px, 92vw); max-height: 86vh; overflow-y: auto; padding: 16px 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .modal h3 { font-size: 14px; margin-bottom: 4px; }
  .modal .sub { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .modal-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .modal-foot .spacer { flex: 1; }
  #issueNote { min-height: 120px; }
  #issueSrc {
    font-size: 12px; color: var(--dim); background: #191c22; border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 8px; margin-bottom: 12px; max-height: 84px; overflow-y: auto;
  }

  /* content / transfer 切換開關 */
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .switch .track {
    width: 30px; height: 16px; border-radius: 9px; position: relative; transition: .15s;
    background: var(--panel2); border: 1px solid var(--line);
  }
  .switch .track::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--dim); transition: .15s;
  }
  .switch input:checked + .track { background: var(--accent2); border-color: var(--accent2); }
  .switch input:checked + .track::after { left: 16px; background: #04121f; }
  .switch:has(input:checked) span { color: var(--accent2); }
</style>
</head>
<body>

<div id="top">
  <h1>分鏡稿編輯器</h1>
  <select id="scriptSel"></select>
  <select id="seriesSel"></select>
  <input id="newSeries" placeholder="或新系列名稱" style="width:130px">
  <button id="btnRenum" title="依台詞順序重新編號整個系列">重新編號</button>
  <div class="spacer"></div>
  <span id="status"></span>
</div>

<div id="main">
  <div id="left">
    <div class="head">
      <span>語音稿台詞</span>
      <span class="tag" id="unitCount"></span>
      <div class="spacer"></div>
      <span id="selInfo" style="color:var(--accent)"></span>
      <button class="primary" id="btnNew" disabled>建立分鏡</button>
    </div>
    <div class="body" id="units"></div>
  </div>

  <div id="divider" title="拖曳調整左右欄寬度"></div>

  <div id="right">
    <div class="head">
      <span id="editTitle">分鏡編輯</span>
      <div class="spacer"></div>
      <label class="switch" title="開＝顯示風格轉換後的 transfer 圖，關＝顯示 content 圖">
        <span>show transfer</span>
        <input type="checkbox" id="swTransfer"><i class="track"></i>
      </label>
      <button id="btnIssue" disabled title="記下這一格哪裡不對，之後拿去迭代 skill">標記問題</button>
      <button id="btnGen" disabled>生成提示詞</button>
      <button id="btnImg" disabled>生成圖片</button>
      <button id="btnTransfer" disabled title="階段 2：把這一格的 content 圖轉成目標畫風">風格轉換</button>
      <button id="btnBatch" disabled>批次生成 8 張</button>
      <button id="btnDel" disabled>刪除</button>
      <button class="primary" id="btnSave" disabled>儲存</button>
    </div>
    <div class="body" id="editor">
      <div class="empty-note">從左邊選取台詞後按「建立分鏡」，或點左邊已標編號的台詞來編輯</div>
    </div>
  </div>
</div>

<div class="mask" id="issueMask" style="display:none">
  <div class="modal">
    <h3>標記問題 <span id="issueSid" class="tag"></span></h3>
    <div class="sub" id="issueMeta"></div>
    <div id="issueSrc"></div>

    <div class="field"><label>問題分類</label>
      <select id="issueCat">
        <option value="">—</option>
        <option value="content">content 圖不對</option>
        <option value="transfer">transfer 畫風不對</option>
        <option value="framing">取景 framing</option>
        <option value="staging">場面調度 staging</option>
        <option value="depiction_mode">呈現手法 depiction_mode</option>
        <option value="prompt">提示詞組裝</option>
        <option value="other">其他</option>
      </select></div>

    <div class="field" style="margin-bottom:0"><label>問題描述</label>
      <textarea id="issueNote" placeholder="這一格哪裡不對？例如：鏡頭選了遠景但主體完全看不出來，不理解為什麼不用中景"></textarea></div>

    <div id="issueErr" style="display:none;color:var(--warn);font-size:12px;margin-top:10px"></div>

    <div class="modal-foot">
      <span class="sub" style="margin:0">清空文字後儲存 ＝ 刪除這一格的記錄</span>
      <div class="spacer"></div>
      <button id="issueCancel">取消</button>
      <button class="primary" id="issueSave">儲存</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let UNITS = [], SCENES = [], CUR = null, SEL = new Set(), BOOT = null, reselectMode = false;
let ISSUES = {};   // { <分鏡 id>: {category, note, updated_at, scene} }

const status = (m, c) => { $('status').textContent = m; $('status').style.color = c || 'var(--dim)'; };
const series = () => $('newSeries').value.trim() || $('seriesSel').value;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 預覽圖：開關開＝看第二階段的 transfer 圖，關＝看 content 圖
const stage = () => $('swTransfer').checked ? 'transfer' : 'content';
const previewSrc = id =>
  `/api/image?series=${encodeURIComponent(series())}&id=${id || CUR}&stage=${stage()}&t=${Date.now()}`;

function onPreviewLoad(el) { el.style.display = 'block'; $('noImg').textContent = ''; }
function onPreviewFail(el) {
  el.style.display = 'none';
  $('noImg').textContent = stage() === 'transfer'
    ? '這一格還沒有 transfer 圖（風格轉換是定稿後才跑的第二階段）' : '';
}

$('swTransfer').onchange = () => { if (CUR) $('preview').src = previewSrc(); };

function syncSelToSource() {
  const el = $('source');
  if (!el) return;
  el.value = [...SEL].sort((a, b) => a - b)
    .map(u => (UNITS.find(x => x.uid === u) || {}).text).filter(Boolean).join(' ');
}

function setReselect(on) {
  reselectMode = on;
  document.body.classList.toggle('reselect', on);
  const btn = $('btnReselect');
  if (btn) { btn.classList.toggle('on', on); btn.textContent = on ? '✓ 完成選取' : '🔗 重新選取台詞'; }
  status(on ? '重新選取中：在左邊拖曳或點台詞，完成後記得按「儲存」' : '已更新選取，記得按「儲存」寫入',
    on ? 'var(--accent2)' : 'var(--ok)');
}

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

async function boot() {
  BOOT = await api('/api/bootstrap');
  $('scriptSel').innerHTML = BOOT.scripts.map(s => `<option>${esc(s)}</option>`).join('');
  $('seriesSel').innerHTML = BOOT.series.map(s => `<option>${esc(s)}</option>`).join('');
  await loadScript(); await loadScenes();
}

async function loadScript() {
  const d = await api('/api/script?file=' + encodeURIComponent($('scriptSel').value));
  UNITS = d.units;
  $('unitCount').textContent = UNITS.length + ' 句';
  renderUnits();
}

async function loadScenes() {
  const s = $('seriesSel').value;
  if (!s) { SCENES = []; ISSUES = {}; renderUnits(); return; }
  SCENES = (await api('/api/scenes?series=' + encodeURIComponent(s)
    + '&script=' + encodeURIComponent($('scriptSel').value))).scenes;
  await loadIssues();
  renderUnits();
}

async function loadIssues() {
  try {
    ISSUES = (await api('/api/feedback?series=' + encodeURIComponent(series()))).issues || {};
  } catch { ISSUES = {}; }   // 還沒有任何記錄不是錯誤
}

function uidToScene() {
  const m = {};
  SCENES.forEach(sc => (sc.line_range || []).forEach(u => m[u] = sc.id));
  return m;
}

function renderUnits() {
  const map = uidToScene();
  const paras = {};
  UNITS.forEach(u => (paras[u.para] = paras[u.para] || []).push(u));
  $('units').innerHTML = Object.values(paras).map(list =>
    `<div class="para">` + list.map(u => {
      const sid = map[u.uid];
      // 相鄰分鏡的編號交錯橘／藍，一眼看得出邊界在哪
      const parity = sid ? (parseInt(sid.replace(/\D/g, ''), 10) % 2 ? 'sid-odd' : 'sid-even') : '';
      const flag = sid && ISSUES[sid] ? 'has-issue' : '';
      return `<div class="unit ${SEL.has(u.uid) ? 'sel' : ''} ${sid ? 'assigned' : ''} ${parity} ${flag}"
        data-uid="${u.uid}" ${sid ? `data-sid="${sid}"` : ''}>${esc(u.text)}</div>`;
    }).join('') + `</div>`
  ).join('');
  bindUnits();
  $('selInfo').textContent = SEL.size ? `已選 ${SEL.size} 句` : '';
  $('btnNew').disabled = !SEL.size;
}

let dragging = false, dragStart = null, dragMoved = false, dragStartSid = null;

function applyRange(fromUid, toUid) {
  const [a, b] = [Math.min(fromUid, toUid), Math.max(fromUid, toUid)];
  SEL.clear();
  for (let i = a; i <= b; i++) SEL.add(i);
  renderUnits();
  if (reselectMode) syncSelToSource();
}

function bindUnits() {
  const box = $('units');
  box.onmousedown = e => {
    const el = e.target.closest('.unit');
    if (!el) return;
    e.preventDefault();
    dragging = true; dragMoved = false;
    dragStart = +el.dataset.uid;
    dragStartSid = el.dataset.sid || null;
    if (!e.shiftKey) SEL.clear();
    SEL.add(dragStart); renderUnits();
    if (reselectMode) syncSelToSource();
    document.body.classList.add('dragging');
  };
  box.onmousemove = e => {
    if (!dragging) return;
    const el = e.target.closest('.unit');
    if (!el) return;
    const uid = +el.dataset.uid;
    if (uid !== dragStart) dragMoved = true;
    applyRange(dragStart, uid);
  };
}

document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  document.body.classList.remove('dragging');
  if (reselectMode) return;
  if (!dragMoved && dragStartSid) openScene(dragStartSid);
});

const FRAMING_LABEL = {
  vocabulary: '詞彙組', shot_size: '景別', angle: '視角', composition: '構圖',
  layout: '版面', info_hierarchy: '資訊層次', directionality: '方向性', contrast_balance: '對比配置',
};

function sel(id, opts, val, allowEmpty = true) {
  const o = (allowEmpty ? ['<option value="">—</option>'] : [])
    .concat(opts.map(x => `<option ${x === val ? 'selected' : ''}>${esc(x)}</option>`));
  return `<select id="${id}">${o.join('')}</select>`;
}

function openScene(id) {
  const s = SCENES.find(x => x.id === id);
  if (!s) return;
  CUR = id;
  reselectMode = false; document.body.classList.remove('reselect');
  SEL = new Set(s.line_range || []);
  renderUnits();
  $('editTitle').textContent = '編輯 ' + id;
  ['btnIssue', 'btnGen', 'btnImg', 'btnTransfer', 'btnBatch', 'btnDel', 'btnSave'].forEach(b => $(b).disabled = false);
  syncIssueBtn();

  const fr = s.framing || {};
  const framingCells = BOOT.framing_fields.map(f =>
    `<div class="field" style="margin:0"><label>${FRAMING_LABEL[f] || f}</label>
      ${sel('fr_' + f, BOOT.framing_options[f] || [], fr[f])}</div>`).join('');

  $('editor').innerHTML = `
    <div class="field">
      <div class="label-row">
        <label>涵蓋的語音稿原文（source）</label>
        <button id="btnReselect" class="mini">🔗 重新選取台詞</button>
      </div>
      <textarea id="source" readonly>${esc(s.source)}</textarea></div>

    <div class="field">
      <div class="label-row">
        <label>畫面命題 focus（觀眾看完這一格會知道：＿＿。）</label>
        <span id="focusHint" class="badge" style="display:none">要寫成完整中文句子</span>
      </div>
      <textarea id="f_focus" placeholder="一句完整的中文句子，結尾是句號或問號。不進 prompt，是 depiction／framing／staging 的依據。">${esc(s.focus)}</textarea></div>

    <div class="split">
      <div class="field"><label>預覽圖</label>
        <img id="preview" src="${previewSrc(id)}"
          onload="onPreviewLoad(this)" onerror="onPreviewFail(this)">
        <div id="noImg" class="empty-note" style="padding:4px 0"></div>
        <div id="cands"></div></div>

      <div class="vdiv" title="拖曳調整預覽圖寬度"></div>

      <div>
        <div class="field" style="border:1px dashed var(--line);padding:8px 10px;border-radius:6px;background:#191c22">
          <div class="label-row">
            <label>貼上 AI 回覆（JSON）→ 自動填入各欄位</label>
            <button id="btnApply" class="mini">套用</button>
          </div>
          <textarea id="aiPaste" placeholder="把 Claude 回覆的 JSON 整段貼在這裡，按「套用」會自動填入下方欄位" style="min-height:56px"></textarea></div>

        <div class="row">
          <div class="field"><label>修辭功能</label>${sel('f_rf', BOOT.rhetorical_functions, s.rhetorical_function, false)}</div>
          <div class="field"><label>呈現手法</label>${sel('f_dm', BOOT.depiction_modes, s.depiction_mode, false)}</div>
          <div class="field"><label>論述單元 unit</label><input id="f_unit" value="${esc(s.unit)}"></div>
        </div>

        <div class="row">
          <div class="field"><label>情緒偏移（中文，無則留白）</label><input id="f_shift" value="${esc(s.emotional_shift)}"></div>
          <div class="field"><label>情緒語句 emotion_en</label><input id="f_emo" value="${esc(s.emotion_en)}"></div>
        </div>

        <div class="row" style="align-items:center;margin-bottom:12px">
          <label class="check"><input type="checkbox" id="f_spec" ${s.is_speculation ? 'checked' : ''}> 推演格（套用推演調性）</label>
          <label class="check"><input type="checkbox" id="f_post" ${s.needs_post_text ? 'checked' : ''}> 需後製文字（不出圖）</label>
          <div class="field" style="margin:0"><label>workflow</label>
            ${sel('f_wf', ['text_only', 'text_with_character'], s.workflow, false)}</div>
        </div>

        <fieldset style="margin-bottom:0"><legend>取景設計 framing</legend>
          <div class="grid4">${framingCells}</div></fieldset>
      </div>
    </div>

    <div class="field"><label>場面調度 staging（英文，只寫畫框內容）</label>
      <textarea id="staging">${esc(s.staging)}</textarea></div>

    <div class="field">
      <div class="label-row">
        <label>生圖提示詞 prompt <span id="manualBadge" class="badge" style="display:none">已手改</span></label>
        <button id="btnRecompose" class="mini">重新組裝</button>
      </div>
      <textarea id="prompt">${esc(s.prompt)}</textarea></div>`;

  $('btnReselect').onclick = () => setReselect(!reselectMode);
  $('btnApply').onclick = applyAiReply;
  $('btnRecompose').onclick = () => recompose(true);
  setManual(!!s.prompt_manual);

  // 任何影響 prompt 的欄位變動 → 自動重組（除非已手改）
  [...BOOT.framing_fields.map(f => 'fr_' + f), 'f_spec', 'f_emo', 'staging']
    .forEach(k => { const el = $(k); if (el) el.addEventListener('change', () => recompose(false)); });
  $('staging').addEventListener('blur', () => recompose(false));
  // focus 不進 prompt（見 storyboard-compose），所以改了不重組，只做 E1 格式提示
  $('f_focus').addEventListener('input', checkFocus);
  checkFocus();
  $('prompt').addEventListener('input', () => setManual(true));
  // 呈現手法改成「主持人出鏡」時自動切 workflow
  $('f_dm').addEventListener('change', () => {
    if ($('f_dm').value === '主持人出鏡') $('f_wf').value = 'text_with_character';
  });

  api(`/api/tmp-images?series=${encodeURIComponent(series())}&id=${id}`)
    .then(d => { if (d.variants && d.variants.length) renderCands(d.variants); })
    .catch(() => {});
}

// E1：命題必須是完整中文句子（結尾句號或問號），名詞片語不算。空白不算錯——還沒填而已。
function checkFocus() {
  const el = $('f_focus');
  if (!el) return;
  const v = el.value.trim();
  const bad = v !== '' && !/[。？]$/.test(v);
  el.classList.toggle('bad', bad);
  const h = $('focusHint');
  if (h) h.style.display = bad ? 'inline-block' : 'none';
}

let manual = false;
function setManual(on) {
  manual = on;
  const b = $('manualBadge');
  if (b) b.style.display = on ? 'inline-block' : 'none';
}

function collect() {
  const s = SCENES.find(x => x.id === CUR);
  if (!s) return null;
  const framing = {};
  BOOT.framing_fields.forEach(f => { framing[f] = $('fr_' + f).value || null; });
  return Object.assign({}, s, {
    focus: $('f_focus').value.trim() || null,
    unit: $('f_unit').value,
    rhetorical_function: $('f_rf').value,
    depiction_mode: $('f_dm').value,
    emotional_shift: $('f_shift').value || null,
    emotion_en: $('f_emo').value,
    is_speculation: $('f_spec').checked,
    needs_post_text: $('f_post').checked,
    workflow: $('f_wf').value,
    framing,
    staging: $('staging').value,
    prompt: $('prompt').value,
    prompt_manual: manual,
    line_range: [...SEL].sort((a, b) => a - b),
    source: [...SEL].sort((a, b) => a - b)
      .map(u => (UNITS.find(x => x.uid === u) || {}).text).filter(Boolean).join(' '),
  });
}

async function recompose(force) {
  if (manual && !force) return;
  const sc = collect();
  if (!sc) return;
  try {
    const d = await api('/api/compose', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scene: sc })
    });
    $('prompt').value = d.prompt;
    setManual(false);
    status('已重新組裝 prompt', 'var(--ok)');
  } catch (e) { status('組裝失敗：' + e.message, 'var(--warn)'); }
}

$('btnNew').onclick = async () => {
  const s = series();
  if (!s) return status('請選擇或輸入系列名稱', 'var(--warn)');
  status('建立中…');
  const d = await api('/api/scene/new', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ series: s, uids: [...SEL], script_file: $('scriptSel').value })
  });
  if ($('newSeries').value.trim()) {
    BOOT = await api('/api/bootstrap');
    $('seriesSel').innerHTML = BOOT.series.map(x => `<option>${esc(x)}</option>`).join('');
    $('seriesSel').value = s; $('newSeries').value = '';
  }
  await loadScenes(); openScene(d.scene.id);
  status('已建立 ' + d.scene.id, 'var(--ok)');
};

$('btnSave').onclick = async () => {
  const sc = collect(); if (!sc) return;
  await api('/api/scene', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ series: series(), scene: sc })
  });
  await loadScenes();
  if (reselectMode) setReselect(false);
  status('已儲存 ' + CUR, 'var(--ok)');
};

$('btnGen').onclick = async () => {
  const src = ($('source') || {}).value || '';
  if (!src.trim()) return status('這一格沒有語音稿原文', 'var(--warn)');
  const d = await api('/api/gen-instruction', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: src })
  });
  try {
    await navigator.clipboard.writeText(d.instruction);
    status('已複製生成指令到剪貼簿 → 貼給 Claude，再把回覆貼回「貼上 AI 回覆」框', 'var(--ok)');
  } catch (e) {
    if ($('aiPaste')) $('aiPaste').value = d.instruction;
    status('無法自動複製，指令已顯示在下方框內，請手動複製', 'var(--warn)');
  }
};

function applyAiReply() {
  const raw = ($('aiPaste') || {}).value || '';
  const m = raw.trim().match(/\{[\s\S]*\}/);
  if (!m) return status('貼上框裡找不到 JSON', 'var(--warn)');
  let o;
  try { o = JSON.parse(m[0]); }
  catch (e) { return status('JSON 解析失敗：' + e.message, 'var(--warn)'); }
  const set = (id, v) => { if (v !== undefined && $(id)) $(id).value = v ?? ''; };
  set('f_focus', o.focus);
  checkFocus();
  set('f_rf', o.rhetorical_function);
  set('f_dm', o.depiction_mode);
  set('f_unit', o.unit);
  set('f_shift', o.emotional_shift);
  set('f_emo', o.emotion_en);
  set('staging', o.staging);
  if (o.is_speculation !== undefined) $('f_spec').checked = !!o.is_speculation;
  if (o.needs_post_text !== undefined) $('f_post').checked = !!o.needs_post_text;
  if (o.workflow) $('f_wf').value = o.workflow;
  if (o.framing) BOOT.framing_fields.forEach(f => {
    if (o.framing[f] !== undefined && $('fr_' + f)) $('fr_' + f).value = o.framing[f] ?? '';
  });
  setManual(false);
  recompose(true);
  status('已套用 AI 回覆並重組 prompt，請檢查後按「儲存」', 'var(--ok)');
}

$('btnImg').onclick = async () => {
  status('生成圖片中…（約 40–50 秒）');
  $('btnImg').disabled = true; $('btnTransfer').disabled = true;
  try {
    const d = await api('/api/generate-image', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ series: series(), id: CUR, seed: Math.floor(Math.random() * 90000) })
    });
    status(d.ok ? `✓ 圖片完成（${d.secs}s, seed=${d.seed}）` : ('✗ ' + (d.note || '生成失敗')),
      d.ok ? 'var(--ok)' : 'var(--warn)');
    // 生成出來的是 content 圖，把開關切回去才看得到
    if (d.ok) { $('swTransfer').checked = false; $('preview').src = previewSrc(); }
  } catch (e) { status('失敗：' + e.message, 'var(--warn)'); }
  $('btnImg').disabled = false; $('btnTransfer').disabled = false;
};

// ── 標記問題 ──────────────────────────────────────────────────────────────

function syncIssueBtn() {
  const it = CUR && ISSUES[CUR];
  $('btnIssue').textContent = it ? '已標記 ⚑' : '標記問題';
  $('btnIssue').classList.toggle('flagged', !!it);
}

function closeIssue() { $('issueMask').style.display = 'none'; }

function issueErr(msg) {
  const el = $('issueErr');
  el.textContent = msg ? '✗ ' + msg : '';
  el.style.display = msg ? 'block' : 'none';
  if (msg) status('✗ ' + msg, 'var(--warn)');
}

$('btnIssue').onclick = () => {
  if (!CUR) return;
  const it = ISSUES[CUR] || {};
  const sc = SCENES.find(x => x.id === CUR) || {};
  $('issueSid').textContent = CUR;
  $('issueMeta').textContent = it.updated_at ? '上次記錄 ' + it.updated_at : '這一格還沒有記錄';
  $('issueSrc').textContent = sc.source || '';
  $('issueCat').value = it.category || '';
  $('issueNote').value = it.note || '';
  issueErr('');
  $('issueMask').style.display = 'flex';
  $('issueNote').focus();
};

$('issueCancel').onclick = closeIssue;
// 點遮罩空白處關閉，但點在 modal 內不關
$('issueMask').onmousedown = e => { if (e.target === $('issueMask')) closeIssue(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('issueMask').style.display !== 'none') closeIssue();
});

$('issueSave').onclick = async () => {
  const note = $('issueNote').value.trim();
  const had = !!ISSUES[CUR];
  if (!note && !had) return issueErr('沒有輸入任何內容');
  if (!note && had && !confirm(`清空文字等於刪除 ${CUR} 的記錄，確定？`)) return;
  try {
    const d = await api('/api/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ series: series(), id: CUR, note, category: $('issueCat').value })
    });
    await loadIssues();
    renderUnits(); syncIssueBtn(); closeIssue();
    status(d.deleted ? `已刪除 ${CUR} 的問題記錄` : `已記下 ${CUR} 的問題`, 'var(--ok)');
  } catch (e) {
    // 錯誤要顯示在彈窗裡。只寫最底下的狀態列，看起來就像按了沒反應
    issueErr(e.message.includes('Not Found')
      ? '後端沒有這個 API，server 需要重新啟動'
      : '儲存失敗：' + e.message);
  }
};

$('btnTransfer').onclick = async () => {
  status('風格轉換中…（含 caption，約 1–3 分鐘）');
  $('btnTransfer').disabled = true; $('btnImg').disabled = true;
  try {
    const d = await api('/api/transfer-image', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ series: series(), id: CUR })
    });
    if (d.log) console.log('[transfer]\n' + d.log);
    if (d.ok) {
      // 轉出來的是 transfer 圖，把開關打開才看得到
      $('swTransfer').checked = true; $('preview').src = previewSrc();
      status(`✓ 風格轉換完成（${d.secs}s）`, 'var(--ok)');
    } else {
      status('✗ ' + (d.note || '風格轉換失敗'), 'var(--warn)');
    }
  } catch (e) { status('失敗：' + e.message, 'var(--warn)'); }
  $('btnTransfer').disabled = false; $('btnImg').disabled = false;
};

$('btnBatch').onclick = async () => {
  status('批次生成 8 張中…（約 6 分鐘）');
  $('btnBatch').disabled = true; $('btnImg').disabled = true; $('btnTransfer').disabled = true;
  try {
    const d = await api('/api/batch-generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ series: series(), id: CUR, seed: Math.floor(Math.random() * 90000) })
    });
    if (d.ok) { renderCands(d.variants); status(`✓ 已生成 ${d.count} 張候選，點縮圖選一張`, 'var(--ok)'); }
    else status('✗ ' + (d.note || '批次生成失敗'), 'var(--warn)');
  } catch (e) { status('失敗：' + e.message, 'var(--warn)'); }
  $('btnBatch').disabled = false; $('btnImg').disabled = false; $('btnTransfer').disabled = false;
};

function renderCands(variants) {
  const box = $('cands');
  if (!box) return;
  if (!variants || !variants.length) { box.className = ''; box.innerHTML = ''; return; }
  const q = `series=${encodeURIComponent(series())}&id=${CUR}`;
  box.innerHTML = variants.map(v =>
    `<div class="cand" data-v="${v}"><img src="/api/image?${q}&variant=${v}&t=${Date.now()}"><span>${v}</span></div>`
  ).join('');
  box.className = 'show';
  box.querySelectorAll('.cand').forEach(el => el.onclick = () => pickCand(el.dataset.v));
}

async function pickCand(v) {
  if (!confirm(`採用候選圖 ${v}？其餘候選會被刪除。`)) return;
  status('搬移中…');
  try {
    await api('/api/pick-image', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ series: series(), id: CUR, variant: v })
    });
    renderCands([]);
    $('swTransfer').checked = false;
    $('preview').src = previewSrc();
    status(`✓ 已採用候選圖 ${v}`, 'var(--ok)');
  } catch (e) { status('失敗：' + e.message, 'var(--warn)'); }
}

$('btnDel').onclick = async () => {
  if (!confirm('確定刪除 ' + CUR + '？（對應的圖片也會刪掉）')) return;
  await api(`/api/scene?series=${encodeURIComponent(series())}&id=${CUR}`, { method: 'DELETE' });
  CUR = null; SEL.clear();
  await loadScenes();
  $('editor').innerHTML = '<div class="empty-note">已刪除</div>';
  ['btnIssue', 'btnGen', 'btnImg', 'btnTransfer', 'btnBatch', 'btnDel', 'btnSave']
    .forEach(b => $(b).disabled = true);
  syncIssueBtn();
  status('已刪除', 'var(--ok)');
};

$('scriptSel').onchange = loadScript;
$('seriesSel').onchange = async () => { CUR = null; SEL.clear(); await loadScenes(); };

$('btnRenum').onclick = async () => {
  const body = { series: series(), script: $('scriptSel').value };
  status('計算新編號中…');
  try {
    const pre = await api('/api/renumber', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, dry_run: true })
    });
    if (!pre.changed) return status('編號已經是正確順序，不需調整', 'var(--ok)');
    const list = pre.changes.slice(0, 12).map(([o, n]) => `${o} → ${n}`).join('\n');
    const more = pre.changes.length > 12 ? `\n…以及其他 ${pre.changes.length - 12} 筆` : '';
    if (!confirm(
      `依台詞順序重新編號，共 ${pre.total} 格，其中 ${pre.changed} 格會改號：\n\n${list}${more}\n\n` +
      `對應的圖片檔案與問題記錄也會一起改名。確定執行？`
    )) return status('已取消');
    status('重新編號中…');
    const d = await api('/api/renumber', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    CUR = null; SEL.clear();
    await loadScenes();
    status(`✓ 已重新編號，${d.changed} 格調整`, 'var(--ok)');
  } catch (e) { status('失敗：' + e.message, 'var(--warn)'); }
};

(function initDivider() {
  const divider = $('divider'), left = $('left'), main = $('main');
  const saved = localStorage.getItem('leftWidth');
  if (saved) left.style.width = saved;
  let d = false;
  divider.addEventListener('mousedown', e => { d = true; document.body.classList.add('col-resizing'); e.preventDefault(); });
  window.addEventListener('mousemove', e => {
    if (!d) return;
    const rect = main.getBoundingClientRect();
    left.style.width = Math.max(240, Math.min(rect.width - 320, e.clientX - rect.left)) + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!d) return;
    d = false; document.body.classList.remove('col-resizing');
    localStorage.setItem('leftWidth', left.style.width);
  });
})();

(function initSplitDivider() {
  // .split 每次 openScene 都會重繪，所以寬度存在 :root 的 CSS 變數上，
  // 事件用委派綁在 #editor，重繪後不用重新綁
  const KEY = 'previewWidth';
  const root = document.documentElement;
  const saved = localStorage.getItem(KEY);
  if (saved) root.style.setProperty('--previewW', saved);

  let split = null;
  $('editor').addEventListener('mousedown', e => {
    if (!e.target.classList.contains('vdiv')) return;
    split = e.target.parentElement;
    document.body.classList.add('col-resizing');
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!split) return;
    const r = split.getBoundingClientRect();
    // 存 % 而不是 px：右側面板本身的寬度也可以拖，比例才跟得上
    const pct = Math.max(15, Math.min(70, (e.clientX - r.left) / r.width * 100));
    root.style.setProperty('--previewW', pct.toFixed(1) + '%');
  });
  window.addEventListener('mouseup', () => {
    if (!split) return;
    split = null;
    document.body.classList.remove('col-resizing');
    localStorage.setItem(KEY, root.style.getPropertyValue('--previewW'));
  });
})();

boot().catch(e => status('載入失敗：' + e.message, 'var(--warn)'));
</script>
</body>
</html>
